<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL Live Network</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #060913; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        
        .al-container { background: #0f172a; border: 1px solid #1e293b; border-radius: 14px; width: 100%; max-width: 420px; height: 92vh; display: flex; flex-direction: column; box-shadow: 0 15px 35px rgba(0,0,0,0.6); overflow: hidden; }
        
        /* Nagłówek AL */
        .al-header { background: #1e293b; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
        .al-brand { font-weight: 700; font-size: 1rem; color: #38bdf8; letter-spacing: 0.8px; text-transform: uppercase; }
        .al-status { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: #4ade80; }
        .dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 6px #4ade80; }

        /* Ekran wyboru nicku */
        #nickView { padding: 40px 20px; text-align: center; margin: auto 0; display: flex; flex-direction: column; gap: 15px; }
        #nickView h2 { font-size: 1.2rem; color: #cbd5e1; }
        
        input { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; background: #0b0f19; color: #fff; font-size: 1rem; outline: none; transition: 0.2s; }
        input:focus { border-color: #38bdf8; }

        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #0284c7; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #0369a1; }

        /* Ekran czatu */
        #chatView { display: none; flex-direction: column; height: 100%; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { max-width: 82%; padding: 10px 14px; border-radius: 10px; font-size: 0.9rem; word-break: break-word; line-height: 1.4; }
        .msg.my-msg { align-self: flex-end; background: #0284c7; color: #fff; border-bottom-right-radius: 2px; }
        .msg.other-msg { align-self: flex-start; background: #1e293b; color: #e2e8f0; border-bottom-left-radius: 2px; border: 1px solid #334155; }
        
        .msg-user { font-size: 0.7rem; font-weight: 700; color: #38bdf8; margin-bottom: 3px; display: block; text-transform: uppercase; }
        
        .chat-input-area { padding: 12px; background: #1e293b; display: flex; gap: 8px; border-top: 1px solid #334155; }
        .chat-input-area input { flex: 1; }
        .chat-input-area .btn { width: auto; padding: 0 18px; margin-top: 0; }
    </style>
</head>
<body>

<div class="al-container">
    <div class="al-header">
        <div class="al-brand">AL // Live Network</div>
        <div class="al-status"><div class="dot"></div> ONLINE</div>
    </div>

    <!-- Ekran logowania -->
    <div id="nickView">
        <h2>Wprowadź swój identyfikator</h2>
        <input type="text" id="nickInput" placeholder="np. kibic, grzechu..." maxlength="15" autocomplete="off">
        <button class="btn" id="joinBtn">Dołącz do AL</button>
    </div>

    <!-- Ekran czatu -->
    <div id="chatView">
        <div class="chat-messages" id="messagesBox"></div>
        <div class="chat-input-area">
            <input type="text" id="msgInput" placeholder="Napisz wiadomość..." autocomplete="off">
            <button class="btn" id="sendBtn">Wyślij</button>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let myName = '';

    const nickView = document.getElementById('nickView');
    const chatView = document.getElementById('chatView');
    const nickInput = document.getElementById('nickInput');
    const joinBtn = document.getElementById('joinBtn');
    const messagesBox = document.getElementById('messagesBox');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');

    joinBtn.addEventListener('click', startChat);
    nickInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') startTask(); }); // zabezpieczenie

    function startChat() {
        const val = nickInput.value.trim();
        if (val) {
            myName = val;
            nickView.style.display = 'none';
            chatView.style.display = 'flex';
            msgInput.focus();
        }
    }

    sendBtn.addEventListener('click', sendTheMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendTheMessage(); });

    function sendTheMessage() {
        const text = msgInput.value.trim();
        if (text && myName) {
            socket.emit('chatMessage', { user: myName, text: text });
            msgInput.value = '';
        }
    }

    socket.on('message', (data) => {
        const div = document.createElement('div');
        const isMine = data.user === myName;
        
        div.classList.add('msg', isMine ? 'my-msg' : 'other-msg');
        div.innerHTML = `
            <span class="msg-user">${data.user}</span>
            <div>${data.text}</div>
        `;
        
        messagesBox.appendChild(div);
        messagesBox.scrollTop = messagesBox.scrollHeight;
    });
</script>

</body>
</html>
